networks:
  redis:
    external: true
services:
  redis:
    image: 'redis:latest'
    container_name: redis
    environment:
      - REDIS_PORT=6379
      - REDIS_DB=0
      - 'REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}'
    volumes:
      - 'redis_data:/data:rw'
    command: 'redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}'
    networks:
      - redis
    healthcheck:
      test:
        - CMD
        - redis-cli
        - '--raw'
        - incr
        - ping
      interval: 10s
      timeout: 3s
      retries: 3
